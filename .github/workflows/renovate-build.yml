name: Run build for renovate PRs

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      javascript: ${{ steps.filter.outputs.javascript }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check for changes
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            javascript:
              - 'package.json'
              - 'yarn.lock'
  build:
    if: ${{ github.actor == 'renovate[bot]' && needs.check.outputs.javascript == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: corepack yarn install

      - name: Run build
        run: corepack yarn build

      - name: Upload dist
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  commit:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.COMMIT_PAT }}

      - name: Clear dist
        run: rm -rf dist

      - name: Download dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: Update dist/ after build
