name: Check dist/

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  RENOVATE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  check-dist:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      drifted: ${{ steps.compare.outputs.drifted }}
      renovate: ${{ steps.compare.outputs.renovate }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Set Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: corepack yarn install

      - name: Rebuild the dist/ directory
        run: corepack yarn build

      - name: Compare the expected and actual dist/ directories
        id: compare
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build.  See status below:"
            git diff
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          fi
          echo "renovate=$RENOVATE_PR" >> "$GITHUB_OUTPUT"

      - name: Upload the rebuilt dist/
        uses: actions/upload-artifact@v7.0.2
        if: ${{ steps.compare.outputs.drifted == 'true' }}
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Fail if dist/ is out of date
        if: ${{ steps.compare.outputs.drifted == 'true' && env.RENOVATE_PR != 'true' }}
        run: |
          echo "dist/ is out of date, run the build and commit the result."
          exit 1

  update-dist:
    needs: check-dist
    if: ${{ !cancelled() && needs.check-dist.outputs.drifted == 'true' && needs.check-dist.outputs.renovate == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.COMMIT_PAT }}

      - name: Clear dist
        run: rm -rf dist

      - name: Download dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: Update dist/ after build
