name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Mise
        uses: jdx/mise-action@v5.2.3

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Run lint
        run: |
          mise run lint --no-progress

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Set Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          corepack yarn install

      - name: Lint the code
        run: |
          corepack yarn run lint

      - name: Run format check
        run: |
          corepack yarn run format

      - name: Check for uncommitted changes
        run: |
          if [ "$(git diff --ignore-space-at-eol | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after linting.  See status below:"
            git diff
            exit 1
          fi

  jactionlint:
    name: jactionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lint Actions
        uses: jdx/jactionlint@v2.3.0
        with:
          advanced-security: true

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        with:
          config: .markdownlint-cli2.yaml
          globs: "**/*.md"
          fix: false
