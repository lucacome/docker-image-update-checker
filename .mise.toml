[tools]
"aqua:owenlamont/ryl" = "0.26.1"
"npm:eslint" = "10.13.0"
"npm:knip" = "6.42.1"
"npm:sort-package-json" = "4.1.0"
"pipx:codespell" = "2.4.3"
betterleaks = "1.9.0"
editorconfig-checker = "4.0.2"
hk = "2.9.0"
jactionlint = "2.3.0"
markdownlint-cli2 = "0.24.0"
pkl = "0.32.2"
prettier = "3.9.10"
typos = "1.51.1"

[tasks.install]
alias = "i"
description = "Install dependencies"
run = "yarn install"

[tasks.build]
alias = "b"
description = "Build the project"
run = "yarn run build"

[tasks.lint]
alias = "l"
description = "Lint the codebase"
run = "hk check --all"

[tasks.format]
alias = "fmt"
description = "Format the codebase"
run = "hk fix --all"

[tasks.postlint]
description = "Run post-lint checks"
run = "git diff --exit-code"

[settings]
idiomatic_version_file_enable_tools = ["node", "yarn"]
experimental = true

[deps.yarn]
auto = true
